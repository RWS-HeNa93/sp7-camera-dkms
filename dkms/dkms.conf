# Surface Pro 7 camera: mainline intel-ipu6 driver + IPU4P RFC v2 series,
# built out of tree so that it replaces the stock intel-ipu6 modules, and the
# ov5693 (front), ov8865 (rear) and dw9719 (rear lens) drivers with the
# Surface Pro 7 fixes.
PACKAGE_NAME="sp7-ipu4p"
PACKAGE_VERSION="rfcv2"

BUILT_MODULE_NAME[0]="intel-ipu6"
BUILT_MODULE_NAME[1]="intel-ipu6-isys"
BUILT_MODULE_NAME[2]="ov5693"
BUILT_MODULE_NAME[3]="ov8865"
BUILT_MODULE_NAME[4]="dw9719"
DEST_MODULE_LOCATION[0]="/extra"
DEST_MODULE_LOCATION[1]="/extra"
DEST_MODULE_LOCATION[2]="/extra"
DEST_MODULE_LOCATION[3]="/extra"
DEST_MODULE_LOCATION[4]="/extra"

MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir} modules"

# The source snapshot is adapted to the 7.3 kernel API and to the
# linux-surface kernel (ov5693.c, ov8865.c and dw9719.c are that kernel's files
# plus a patch each). Skip every other kernel instead of failing.
BUILD_EXCLUSIVE_KERNEL="^7\.3\..*surface"

AUTOINSTALL="yes"
