# Surface Pro 7 cameras: options for the patched drivers of the sp7-ipu4p DKMS
# package. Changes take effect after a reboot; the parameters marked (live)
# can also be changed at once, for example:
#   echo 0 | sudo tee /sys/module/ov5693/parameters/mirror

# mirror (live): the picture libcamera gets from both sensors is reversed left
# to right (text unreadable). mirror=1 inverts the horizontal flip, so every
# application gets the true picture. Video-call apps then mirror your own
# preview themselves.
options ov5693 mirror=1

# vcm (live): keep the rear lens motor powered while the rear camera streams,
# so that the lens is held at dw9719's default_focus position. Without it the
# lens sits parked and the rear picture is out of focus.
options ov8865 mirror=1 vcm=1

# Rear lens. libcamera has no autofocus for these cameras, so the focus is
# fixed. default_focus (live, 0-1023): larger values focus closer. 220 suits
# the machine this was developed on at 2-3 m; calibrate yours with
# scripts/focus-calibrate.sh from the sp7-camera-dkms repository.
# focus_overshoot (live): go this far past the position first and come back
# down to it; without it the lens sometimes sticks short of the position.
# devnode=0: no V4L2 device node, otherwise libcamera would keep the lens and
# the rear sensor powered for as long as WirePlumber runs.
options dw9719 devnode=0 focus_overshoot=128 default_focus=220
