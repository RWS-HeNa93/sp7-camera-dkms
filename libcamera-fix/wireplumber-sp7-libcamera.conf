# Surface Pro 7 cameras: make WirePlumber (which runs the cameras for apps)
# load the corrected private copy of libcamera, and refresh that copy before
# every start. See ~/.local/bin/sp7-libcamera-fix for what is corrected.
# Without a copy in that directory the system library is used as usual.
# Remove this file (then: systemctl --user daemon-reload, restart wireplumber)
# to switch the fixes off.
[Service]
ExecStartPre=-%h/.local/bin/sp7-libcamera-fix
Environment=LD_LIBRARY_PATH=%h/.local/lib/libcamera-sp7
